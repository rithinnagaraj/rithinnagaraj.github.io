baseURL = "https://rithinnagaraj.github.io/"
locale = "en-us"
title = "Rithin Nagaraj"
enableRobotsTXT = true

# The site uses its own small theme in /layouts and /assets (no external theme).

[params]
  description = "Rithin Nagaraj is a CS undergraduate researching reinforcement learning, AI safety and control, continual learning, world models and interpretability."
  email = "rithin.nagaraj@gmail.com"
  github = "https://github.com/rithinnagaraj"
  # Served from the repo root via the mount below, so recompiling main.tex updates the site.
  cv = "rithin_cv.pdf"

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    style = "dracula"

# Default mounts, plus the compiled CV from the repo root.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "rithin_cv.pdf"
    target = "static/rithin_cv.pdf"
