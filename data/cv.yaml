publications:
  - title: "Pharmacokinetic SSMs for Haemodynamic Collapse Prediction"
    venue: "AIiH 2026"
    award: "Best Paper Nominee (top 3%)"
    authors: ["Rithin Nagaraj", "Sudiksha Chindula", "Bhaskarjyoti Das"]
    links:
      - { label: "DOI", url: "https://doi.org/10.1007/978-3-032-35387-0_22" }
      - { label: "arXiv", url: "https://arxiv.org/abs/2609.24338" }
    bullets:
      - "Architected a Mamba-based selective state space model to forecast intraoperative hypotension 5 to 15 minutes in advance, achieving **0.7360 AUROC** and a **2.73-fold AUPRC lift** over random guessing."
      - "Engineered Propofol and Remifentanil effect-site concentration trajectories as explicit inputs, preventing a **13.9% AUPRC drop** compared with haemodynamics-only baselines."
      - "Quantified lead-gap contamination in prior evaluation setups, with strict temporal boundaries reducing apparent AUROC by **16.7%** compared with the less constrained evaluation."

  - title: "CAP-Adam: Inspectable Protection for Continual Learning"
    venue: "Under review at TMLR"
    authors: ["Rithin Nagaraj", "Paras Chopra"]
    links: []
    bullets:
      - "Proposed a continual learning optimizer that modulates parameter updates by their importance to previously learned tasks, outperforming AdamW and established baselines including Elastic Weight Consolidation (EWC)."
      - "Achieved approximately **90% retention across 40 unique tasks** while maintaining **91% mean current-task accuracy over 200 sequential tasks** on Permuted MNIST with an MLP-300 model."
      - "Showed that optimizer hyperparameters systematically control the stability–plasticity trade-off, enabling controlled studies of knowledge retention and adaptation."

  - title: "Comparing Latent Concept Formation in SSMs and Transformers via SAEs"
    venue: "arXiv preprint, 2026"
    authors: ["Rithin Nagaraj", "Prerna Subhashchandra Kunder", "Rupa Laalasa Oruganti", "Aswhini Joshi"]
    links:
      - { label: "arXiv", url: "https://arxiv.org/abs/2609.24440" }
    bullets:
      - "Mapped feature-level correspondences between Mamba-130m and Pythia-70m using sparse autoencoder dictionaries over **10M text tokens**, finding no evidence of architecture-exclusive Dark Matter features."
      - "Identified monosemantic landmark features in Mamba's recurrent hidden state and hypothesized that they act as periodic state resets that compensate for the absence of global positional attention."

