ongoing:
  - title: "Continual RLVR and Safety-Support Collapse"
    where: "Imperial College London"
    code: "https://github.com/rithinnagaraj/safety-support-collapse"
    bullets:
      - "Asking whether training a 3B Qwen model on a sequence of harmless tasks with **RL from verifiable rewards (RLVR)** can quietly make useful, safe answers on earlier tasks unreachable, even while task accuracy and aggregate safety metrics look stable."
      - "Measuring how many rollouts **corrective RLVR** needs before earlier tasks give a useful learning signal again, to see whether continual training makes safety fixes more expensive."
  - title: "Adversarially Trained Container Design for LLM Agent Control"
    where: "Lossfunk"
    code: "https://github.com/rithinnagaraj/adversarial-sandbox"
    bullets:
      - "Training a **designer model** against LLM agents to write Docker configurations that stop a possibly misaligned agent from escaping or causing harm, without blocking the harmless work it is there to do."
      - "In a first sanity check with **Qwen3-30B-A3B, DeepSeek-V4-Pro and GLM-5.3** as agents (4 routes to harm, ~5,000 possible configurations), a simple softmax policy found a setup that was both safe and useful within **20 episodes**."
      - "Next: adding more independent routes to harm and opening up a much larger configuration space."
  - title: "Confounding in Learned World Models for Anesthesia Dosing"
    where: "PES University"
    code: "https://github.com/rithinnagaraj/anesthetic-world-models"
    bullets:
      - "Clinicians adjust doses in response to what they see, so a model trained on recorded surgeries can pick up those reactions instead of how the drugs actually work. Testing whether world models fall into this trap, since RL dosing policies would be trained inside them."
      - "Trained **25 models** (GRU, Transformer, RSSM, a 5-RSSM ensemble, and a hybrid where doses act only through pharmacokinetic–pharmacodynamic equations; 5 seeds each). The black boxes predict well: 6.9–7.2 five-minute BIS error, **27–29% better** than pharmacology alone."
      - "Early counterfactual tests suggest they learned only part of the story: drug effects point the right way but are just **12–21% as strong** as pharmacology predicts and arrive **3–7 min late**. The hybrid recovers **~72%** of the expected effect with correct timing, at a 12% cost in BIS accuracy."

