{{- $w := 0 }}{{ $h := 0 }}
{{- with .Page.Resources.Get .Destination }}{{ if in (slice "image/png" "image/jpeg" "image/gif" "image/webp") .MediaType.Type }}{{ $w = .Width }}{{ $h = .Height }}{{ end }}{{ end -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $w }} width="{{ $w }}" height="{{ $h }}"{{ end }} loading="lazy" decoding="async">
